
name: windows-installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Official v4/v5 action refs verified on 2026-10-02.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --name pro-ref --paths src --add-data "src/api_gui:api_gui" run.py
      - name: Install WiX
        run: choco install wixtoolset --no-progress -y
      - name: Build MSI with WiX
        shell: pwsh
        run: |
          # Chocolatey installs WiX binaries separately from its package scripts.
          $wixRoot = [Environment]::GetEnvironmentVariable('WIX', 'Machine')
          if ([string]::IsNullOrEmpty($wixRoot)) { $wixRoot = $env:WIX }
          if ([string]::IsNullOrEmpty($wixRoot)) { throw 'WiX v3 installation was not found.' }
          $wixBin = Join-Path $wixRoot 'bin'
          $candle = Join-Path $wixBin 'candle.exe'
          $light = Join-Path $wixBin 'light.exe'
          if (-not (Test-Path -LiteralPath $candle -PathType Leaf) -or
              -not (Test-Path -LiteralPath $light -PathType Leaf)) {
            throw 'WiX v3 compiler and linker were not found.'
          }
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="Pro-Ref" Language="1033" Version="1.0.0" Manufacturer="Lumenci" UpgradeCode="D1F9C9BE-0000-4000-8000-000000000000">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine"/>
              <MediaTemplate/>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="Pro-Ref"/>
                </Directory>
              </Directory>
              <DirectoryRef Id="INSTALLFOLDER">
                <Component Id="MainExe" Guid="*"> 
                  <File Id="ProRefExe" Source="dist\pro-ref.exe" KeyPath="yes"/>
                </Component>
              </DirectoryRef>
              <Feature Id="MainFeature" Level="1">
                <ComponentRef Id="MainExe"/>
              </Feature>
            </Product>
          </Wix>' | Out-File product.wxs -Encoding utf8
          & $candle product.wxs -o product.wixobj
          if ($LASTEXITCODE -ne 0) { throw "WiX candle failed: $LASTEXITCODE" }
          & $light product.wixobj -o pro-ref.msi
          if ($LASTEXITCODE -ne 0) { throw "WiX light failed: $LASTEXITCODE" }
      - name: Code sign (optional)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PWD: ${{ secrets.WINDOWS_CERT_PWD }}
        run: ./scripts/sign_windows.ps1
      - name: Upload MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pro-ref-msi
          path: pro-ref.msi
          if-no-files-found: error
